<svg xmlns="http://www.w3.org/2000/svg" width="115" height="28">
  <style>
    @keyframes pulse {
      0%, 100% { stroke: #555; stroke-width: 1px; }
      50% { stroke: #aaa; stroke-width: 3px; }
    }
    .bg { fill: #222; animation: pulse 2s infinite ease-in-out; }
    .text { font-family: 'Segoe UI', sans-serif; font-size: 12px; fill: #ccc; font-weight: bold; letter-spacing: 1px; }
  </style>
  <rect x="2" y="2" width="111" height="24" class="bg" />
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" class="text">NOT STARTED</text>
</svg>
