<svg xmlns="http://www.w3.org/2000/svg" width="115" height="28">
  <style>
    @keyframes glow {
      0%, 100% { stroke: #10b981; stroke-width: 1px; filter: drop-shadow(0 0 2px #10b981); }
      50% { stroke: #34d399; stroke-width: 2px; filter: drop-shadow(0 0 6px #34d399); }
    }
    .bg { fill: #062a1a; animation: glow 3s infinite ease-in-out; }
    .text { font-family: 'Segoe UI', sans-serif; font-size: 12px; fill: #34d399; font-weight: bold; letter-spacing: 1px; }
  </style>
  <rect x="2" y="2" width="111" height="24" class="bg" />
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" class="text">COMPLETED</text>
</svg>
