{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="{{ url_for('static', filename='dispatch-console.css') }}">
<style>
    .ops-page { height: calc(100vh - 28px); min-height: 560px; display:flex; flex-direction:column; gap:12px; }
    .ops-header { display:flex; align-items:center; justify-content:space-between; min-height:42px; }
    .ops-brand { color:#dce2e7; font:500 1.28rem var(--font-title); letter-spacing:2.3px; position:relative; }
    .ops-brand::after { content:"AEGIS TWIN"; position:absolute; inset:0; color:transparent; background:linear-gradient(105deg,transparent 48%,#fff 50%,transparent 52%); background-size:260% 100%; background-clip:text; -webkit-background-clip:text; animation:ops-shine 12s linear infinite; pointer-events:none; }
    @keyframes ops-shine { from { background-position:220% 0; } to { background-position:-120% 0; } }
    .ops-location { color:#8a949e; font: .62rem var(--font-title); letter-spacing:1.5px; }
    .ops-layout { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,7fr) minmax(310px,3fr); gap:12px; }
    .map-frame,.status-panel { border:1px solid rgba(255,255,255,.09); border-radius:13px; background:#0b0f13; overflow:hidden; }
    .map-frame { position:relative; min-height:0; }
    #dispatch-map { width:100%; height:100%; background:#10151a; }
    .map-caption { position:absolute; z-index:500; bottom:12px; left:12px; background:rgba(8,12,16,.9); border:1px solid rgba(255,255,255,.09); border-radius:7px; padding:7px 9px; color:#a5afb8; font: .57rem var(--font-title); letter-spacing:.7px; }
    .status-panel { display:flex; flex-direction:column; min-height:0; }
    .panel-top { padding:13px 14px 10px; border-bottom:1px solid rgba(255,255,255,.07); }
    .panel-title { color:#e0e5e9; font: .72rem var(--font-title); letter-spacing:1.25px; }
    .panel-subtitle { color:#77828b; font-size:.62rem; margin-top:4px; }
    .status-tabs { display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:10px 12px; }
    .status-tab { display:flex; justify-content:space-between; gap:5px; border:1px solid rgba(255,255,255,.08); border-radius:7px; background:#10151a; color:#9da7af; padding:8px 9px; cursor:pointer; font: .58rem var(--font-title); letter-spacing:.5px; }
    .status-tab.active { border-color:rgba(255,255,255,.2); color:#edf1f3; background:#171d22; }
    .status-count { color:#e4e9ed; font-variant-numeric:tabular-nums; }
    .dispatch-form { display:grid; grid-template-columns:1fr 1.2fr auto; gap:6px; padding:0 12px 10px; }
    .dispatch-form select,.dispatch-form button { min-width:0; height:31px; border:1px solid rgba(255,255,255,.1); border-radius:6px; background:#11171c; color:#d8dee3; padding:0 7px; font: .57rem var(--font-title); }
    .dispatch-form select option { color:#111; }
    .dispatch-form button { background:#e6eaed; color:#101419; border-color:#e6eaed; padding:0 10px; cursor:pointer; }
    .dispatch-list { flex:1; min-height:0; overflow-y:auto; padding:0 10px 10px; display:flex; flex-direction:column; gap:6px; }
    .dispatch-card { background:#10151a; border:1px solid rgba(255,255,255,.07); border-radius:8px; padding:9px 10px; border-left:2px solid #62bc93; cursor:pointer; }
    .dispatch-card.slowed { border-left-color:#cbb66c; }
    .dispatch-card.needs_assistance,.dispatch-card.assistance_requested { border-left-color:#c87379; }
    .dispatch-card.cancelled { border-left-color:#737e87; }
    .dispatch-card.selected { background:#171d22; border-color:rgba(255,255,255,.16); }
    .dispatch-row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .dispatch-truck { color:#e0e5e9; font: .62rem var(--font-title); letter-spacing:.6px; }
    .dispatch-state { color:#86c9a7; font: .51rem var(--font-title); letter-spacing:.55px; }
    .slowed .dispatch-state { color:#d2bd76; }
    .needs_assistance .dispatch-state,.assistance_requested .dispatch-state { color:#d7898e; }
    .dispatch-destination { color:#9da7af; font-size:.61rem; margin-top:5px; }
    .dispatch-details { display:flex; justify-content:space-between; color:#727e87; font: .54rem var(--font-title); margin-top:6px; }
    .dispatch-actions { display:flex; gap:5px; margin-top:7px; }
    .dispatch-action { border:1px solid rgba(255,255,255,.13); border-radius:5px; background:transparent; color:#c8d0d5; padding:4px 7px; cursor:pointer; font: .52rem var(--font-title); }
    .dispatch-action.help { border-color:rgba(210,137,142,.35); color:#d7898e; }
    .dispatch-action.cancel { color:#8b949b; }
    .dispatch-action.resume { color:#91cbaa; }
    .success-card { background:#11171b; border:1px solid rgba(255,255,255,.08); border-radius:8px; padding:9px 10px; color:#d3d9de; font-size:.6rem; line-height:1.45; }
    .success-line { color:#9bcdb0; font: .54rem var(--font-title); letter-spacing:.45px; }
    .success-card hr { border:0; border-top:1px solid rgba(255,255,255,.07); margin:6px 0; }
    .empty-state { color:#73808a; text-align:center; padding:24px 8px; font-size:.63rem; }
    .leaflet-container { background:#10151a; font-family:var(--font-body); }
    .leaflet-control-zoom a { background:#11171c!important; color:#d5dce1!important; border-color:#303940!important; }
    .leaflet-control-attribution { background:rgba(8,12,16,.65)!important; color:#77828b!important; font-size:9px!important; }
    .leaflet-control-attribution a { color:#aab4bc!important; }
    .warehouse-icon { color:#d8dee3; background:#10161b; border:1px solid #78838b; width:10px; height:10px; border-radius:3px; }
    @media(max-width:920px) {
        .ops-page { height:auto; min-height:calc(100vh - 30px); }
        .ops-layout { grid-template-columns:1fr; }
        .map-frame { height:58vh; min-height:370px; }
        .status-panel { min-height:500px; }
        .dispatch-form { grid-template-columns:1fr 1fr; }
        .dispatch-form button { grid-column:1 / -1; }
    }
</style>

<main class="ops-page">
    <header class="ops-header">
        <div class="ops-brand">AEGIS TWIN</div>
        <div class="ops-location">SEATTLE · LIVE OPERATIONS</div>
    </header>
    <div class="ops-layout">
        <section class="map-frame">
            <div id="dispatch-map" aria-label="Seattle live truck map"></div>
            <div class="map-caption" id="map-caption">SEATTLE OPERATIONS · ROUTE SHOWN FOR SELECTED TRUCK</div>
        </section>
        <aside class="status-panel">
            <header class="panel-top"><div class="panel-title">DISPATCH STATUS</div><div class="panel-subtitle" id="live-state">Connecting to fleet…</div></header>
            <div class="status-tabs">
                <button class="status-tab" data-filter="finished">FINISHED <span class="status-count" data-count="finished">0</span></button>
                <button class="status-tab active" data-filter="ongoing">ONGOING <span class="status-count" data-count="ongoing">0</span></button>
                <button class="status-tab" data-filter="attention">NEEDS ATTENTION <span class="status-count" data-count="attention">0</span></button>
                <button class="status-tab" data-filter="cancelled">CANCELLED <span class="status-count" data-count="cancelled">0</span></button>
            </div>
            <form class="dispatch-form" id="dispatch-form">
                <select id="origin-select" aria-label="Dispatch warehouse"></select>
                <select id="destination-select" aria-label="Dispatch destination"></select>
                <button type="submit" id="create-dispatch">CREATE</button>
            </form>
            <div class="dispatch-list" id="dispatch-list"></div>
        </aside>
    </div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="{{ url_for('static', filename='dispatch-console.js') }}"></script>
{% endblock %}
