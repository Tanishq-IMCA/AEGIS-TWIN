{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='dispatch-console.css') }}">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
    .control-page { min-height:calc(100vh - 50px); max-width:950px; margin:0 auto; color:#dce2e7; }
    .control-heading { display:flex; justify-content:space-between; align-items:end; margin-bottom:16px; }
    .control-heading h1 { margin:0; font:500 1.25rem var(--font-title); letter-spacing:1.8px; }
    .control-heading p { margin:5px 0 0; color:#7f8991; font-size:.67rem; }
    .control-page .status-panel { min-height:65vh; }
    .control-page .dispatch-list { padding-top:8px; }
    .control-page .dispatch-card { padding:13px; }
    .control-page .dispatch-truck { font-size:.7rem; }
    .control-page .dispatch-destination { font-size:.67rem; }
    .control-page .dispatch-details { font-size:.59rem; }
    .control-page .dispatch-form { grid-template-columns:1fr 1.4fr auto; }
</style>
<main class="control-page">
    <header class="control-heading">
        <div><h1>CONTROL PANEL</h1><p>Dispatch assignment and roadside response.</p></div>
        <span class="ops-location" id="live-state">CONNECTING</span>
    </header>
    <section class="status-panel">
        <div class="status-tabs">
            <button class="status-tab" data-filter="finished">FINISHED <span class="status-count" data-count="finished">0</span></button>
            <button class="status-tab active" data-filter="ongoing">ONGOING <span class="status-count" data-count="ongoing">0</span></button>
            <button class="status-tab" data-filter="attention">NEEDS ATTENTION <span class="status-count" data-count="attention">0</span></button>
            <button class="status-tab" data-filter="cancelled">CANCELLED <span class="status-count" data-count="cancelled">0</span></button>
        </div>
        <form class="dispatch-form" id="dispatch-form">
            <select id="origin-select" aria-label="Dispatch warehouse"></select>
            <select id="destination-select" aria-label="Dispatch destination"></select>
            <button type="submit">CREATE DISPATCH</button>
        </form>
        <div class="dispatch-list" id="dispatch-list"></div>
    </section>
</main>
<script src="{{ url_for('static', filename='dispatch-console.js') }}"></script>
{% endblock %}
