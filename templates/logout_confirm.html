{% extends "base.html" %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 100px); padding: 20px;">
    <div class="glass-panel" style="max-width: 450px; width: 100%; padding: 40px; text-align: center;">
        <div style="margin-bottom: 30px;">
            <i class="fa-solid fa-right-from-bracket" style="font-size: 3.5rem; color: var(--accent-orange); filter: drop-shadow(0 0 15px var(--accent-glow));"></i>
        </div>
        
        <h2 style="font-family: var(--font-title); letter-spacing: 4px; margin-bottom: 10px;">TERMINATE SESSION?</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 35px; letter-spacing: 1px;">Are you sure you want to disconnect from the Nexus?</p>
        
        <div style="display: flex; flex-direction: column; gap: 15px;">
            <a href="{{ url_for('logout_action') }}" style="background: var(--accent-orange); color: black; text-decoration: none; padding: 12px; border-radius: 12px; font-family: var(--font-title); font-size: 0.8rem; letter-spacing: 2px; transition: all 0.3s ease; box-shadow: 0 4px 15px var(--accent-glow);" onmouseover="this.style.filter='brightness(1.2)'; this.style.transform='translateY(-2px)'" onmouseout="this.style.filter='none'; this.style.transform='none'">
                CONFIRM LOGOUT
            </a>
            
            <a href="{{ url_for('index') }}" style="background: rgba(255, 255, 255, 0.05); color: white; text-decoration: none; padding: 12px; border-radius: 12px; font-family: var(--font-title); font-size: 0.8rem; letter-spacing: 2px; border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.3s ease;" onmouseover="this.style.background='rgba(255, 255, 255, 0.1)'; this.style.transform='translateY(-2px)'" onmouseout="this.style.background='rgba(255, 255, 255, 0.05)'; this.style.transform='none'">
                RETURN TO HOME
            </a>
        </div>
    </div>
</div>
{% endblock %}
